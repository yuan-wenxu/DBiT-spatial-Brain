[workspace]
authors = ["wenxu yuan <yuanwenxu123@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "DBiT-spatial-Brain"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]

[feature.domain.dependencies]
python = "3.12.*"
pandas = "2.3.3.*"
matplotlib-base = "3.10.*"
scanpy = "1.11.5.*"
python-igraph = ">=1.0.0,<2"
leidenalg = ">=0.11.0,<0.12"
pillow = ">=11,<13"

[feature.domain.pypi-dependencies]
pybanksy = ">=1.3.5,<2"

[feature.rctd.dependencies]
r = ">=4.3,<4.4"
r-spacexr = ">=2.2.1,<3"
r-hdf5r = ">=1.3.12,<2"
"r-data.table" = ">=1.17,<2"
r-matrix = ">=1.6,<2"

[environments]
default = ["domain"]
rctd = ["rctd"]
